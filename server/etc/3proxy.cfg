# jivenet 3proxy config — auto-режим (HTTP + SOCKS4/5 на одном порту).
#
# Детектит протокол по первому байту: 'G','P','C','O',… → HTTP,
# 0x04 → SOCKS4, 0x05 → SOCKS5. Android Wi-Fi настройки (HTTP) и
# Firefox/FoxyProxy (SOCKS5) оба работают через тот же адрес
# 127.0.0.1:3128 внутри туннеля.

# DNS-резолверы: 3proxy сам резолвит имена клиентских запросов
nserver 1.1.1.1
nserver 1.0.0.1
nserver 8.8.8.8
nscache 65536

# Таймауты: сериализация, keep-alive, idle, connect, tcp, udp, dns, establish
timeouts 1 5 30 60 180 1800 15 60

# Логи в stderr → systemd journal (см. unit-файл)
log

# ACL: без аутентификации, принимаем только loopback.
# Bind'а на 127.0.0.1 в auto-директиве хватает — извне подключиться нельзя
# даже физически. auth none — потому что на уровне dnstt уже есть Noise_NK.
auth none
allow * 127.0.0.1

# Поднимаем лимит подключений: Chrome через VpnService+tun2socks открывает
# много SOCKS5-UDP сессий для QUIC (HTTP/3), и 100-й дефолт упирается за
# секунды → "too many connected clients".
maxconn 4096

# Auto-режим: один порт, оба протокола.
# -46: разрешаем IPv4+IPv6.
# QUIC (HTTP/3) клиенты пытаются идти по UDP через SOCKS5 UDP ASSOCIATE —
# 3proxy создаёт UDPMAP-сессии, и они быстро забивают пул.
# Но через DNS-туннель UDP бесполезен (KCP+smux только TCP-байт-стрим).
# Поэтому Android-клиент гасить QUIC через `Builder.addRoute` не умеет —
# приходится принимать UDPMAP здесь и просто отбрасывать. Поднятый maxconn
# даёт буфер, пока Chrome fallback'ает на TCP HTTP/2.
auto -p3128 -i127.0.0.1
